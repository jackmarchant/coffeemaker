# Reverse-proxy nginx config for coffeemaker.
#
# The Node server (server.js) serves BOTH the static front-end and the
# /api/beans API, so nginx just needs to forward everything to it. This
# replaces any older config that served the static files directly from a
# webroot (those stale files still reference Supabase and won't work).
#
# Install (Amazon Linux / RHEL):
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/coffeemaker.conf
#   # remove or disable the old server block / default site first
#   sudo nginx -t            # check config is valid
#   sudo systemctl reload nginx
#
# On Ubuntu/Debian put it in /etc/nginx/sites-available/coffeemaker and
# symlink it into sites-enabled/.

server {
    listen 80;
    server_name _;          # replace with your domain, e.g. beans.example.com

    # Forward every request to the Node server.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
